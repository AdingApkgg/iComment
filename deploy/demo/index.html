<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>iComment 演示 · 一篇文章</title>
<style>
  :root { color-scheme: light dark; }
  body { margin:0; font:16px/1.7 ui-sans-serif,system-ui,-apple-system,"Noto Sans SC",sans-serif;
    background:#fbfbfc; color:#14171c; }
  @media (prefers-color-scheme: dark) { body { background:#0d1014; color:#e7eaf0; } }
  article { max-width:680px; margin:0 auto; padding:56px 20px 0; }
  h1 { font-size:30px; line-height:1.25; letter-spacing:-.02em; margin:0 0 8px; }
  .byline { color:#6b7280; font-size:14px; margin-bottom:32px; }
  p { margin:0 0 18px; }
  blockquote { margin:0 0 18px; padding-left:14px; border-left:2px solid #2f6df6; color:#5b6472; }
  section { max-width:680px; margin:8px auto 80px; padding:0 20px; }
  hr { border:0; border-top:1px solid #e6e8ec; margin:40px 0 32px; }
  @media (prefers-color-scheme: dark) { hr { border-color:#222833; } }
</style>
</head>
<body>
<article>
  <h1>把评论自己养起来</h1>
  <div class="byline">演示文章 · 5 分钟读完</div>
  <p>这篇文章下面挂的就是 <code>&lt;ic-comment&gt;</code> 组件。它只有一个标签、一份十几 KB 的脚本，数据全在自己的数据库里。</p>
  <blockquote>没有第三方 iframe，没有「服务下线评论就消失」。</blockquote>
  <p>试着发一条：昵称随便填，正文支持 Markdown。发完刷新页面，评论还在。</p>
  <p>往回看，作者回复、楼中楼、翻页都在同一个组件里。</p>
</article>
<section>
  <hr>
  <ic-comment site-key="__SITE_KEY__" api-base="__API_BASE__" path="/posts/hello"></ic-comment>
  <script src="__WIDGET__" defer></script>
</section>
</body>
</html>
