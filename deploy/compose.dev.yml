# 只起来存附图用的 SeaweedFS（master + volume + filer），给本地 cargo run 用。
#   docker compose -f deploy/compose.dev.yml up -d
#   export IC_SEAWEED_FILER_URL=http://127.0.0.1:18888/uploads
# filer 只在本机 18888 暴露；生产用 deploy/compose.yml 里那组。
name: icomment-dev

services:
  weed-master:
    image: chrislusf/seaweedfs:4.48
    restart: unless-stopped
    command: >-
      master -ip=weed-master -mdir=/data -volumeSizeLimitMB=1024
      -defaultReplication=000
    volumes: ["weedm:/data"]
  weed-volume:
    image: chrislusf/seaweedfs:4.48
    restart: unless-stopped
    command: volume -master=weed-master:9333 -ip=weed-volume -dir=/data -max=0
    volumes: ["weedv:/data"]
    depends_on: [weed-master]
  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    restart: unless-stopped
    command: filer -master=weed-master:9333 -ip=seaweedfs -port=8888
    ports: ["127.0.0.1:18888:8888"]
    depends_on: [weed-master, weed-volume]
volumes:
  weedm:
  weedv:
