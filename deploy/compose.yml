# iComment 自托管部署：核心 + PG + Redis + SeaweedFS（存附图），Caddy 在前面收 HTTPS。
# 用法：
#   cp deploy/.env.example deploy/.env   # 填域名与密码
#   docker compose -f deploy/compose.yml --env-file deploy/.env up -d --build

name: icomment

services:
  core:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      IC_PROFILE: prod
      IC_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      IC_REDIS_URL: redis://redis:6379
      IC_PUBLIC_BASE_URL: https://${IC_DOMAIN}${IC_PUBLIC_PORT_SUFFIX:-}
      IC_WIDGET_CDN: https://${IC_DOMAIN}/widget/v1
      # 两个都填才启用人机验证，留空则整体关闭
      IC_TURNSTILE_SECRET: ${IC_TURNSTILE_SECRET:-}
      IC_TURNSTILE_SITE_KEY: ${IC_TURNSTILE_SITE_KEY:-}
      IC_SESSION_SECRET: ${IC_SESSION_SECRET}
      # 登录：OAuth 两个都填才出现按钮；邮箱直登只在非 prod 默认开
      IC_GOOGLE_CLIENT_ID: ${IC_GOOGLE_CLIENT_ID:-}
      IC_GOOGLE_CLIENT_SECRET: ${IC_GOOGLE_CLIENT_SECRET:-}
      IC_GITHUB_CLIENT_ID: ${IC_GITHUB_CLIENT_ID:-}
      IC_GITHUB_CLIENT_SECRET: ${IC_GITHUB_CLIENT_SECRET:-}
      IC_EMAIL_LOGIN: ${IC_EMAIL_LOGIN:-0}
      # 建站前的域名归属校验，prod 默认开
      IC_CLAIM_VERIFY: ${IC_CLAIM_VERIFY:-1}
      IC_AKISMET_KEY: ${IC_AKISMET_KEY:-}
      # 附图存 SeaweedFS 的 filer；留空则退回容器内文件，重启即丢
      IC_SEAWEED_FILER_URL: http://seaweedfs:8888/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      seaweedfs:
        condition: service_started
    expose:
      - "8080"
    healthcheck:
      # distroless 没有 curl，用镜像自带的 health 子命令更稳
      test: ["CMD", "/usr/local/bin/icomment-core", "health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      # PG18 起数据目录带主版本子目录，挂父目录才能跨版本 pg_upgrade
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", ""]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  weed-volume:
    image: chrislusf/seaweedfs:4.48
    restart: unless-stopped
    # 单卷节点，数据落在卷里；沿用官方 server 的默认端口
    command: >
      volume -master=weed-master:9333 -ip=weed-volume -dir=/data -max=0
    volumes:
      - weeddata:/data
    depends_on:
      - weed-master

  weed-master:
    image: chrislusf/seaweedfs:4.48
    restart: unless-stopped
    command: >
      master -ip=weed-master -mdir=/data -volumeSizeLimitMB=1024 -defaultReplication=000
    volumes:
      - weedmaster:/data

  seaweedfs:
    # filer 是核心唯一会说话的节点：按路径存取字节，不做 S3 签名
    image: chrislusf/seaweedfs:4.48
    restart: unless-stopped
    command: >
      filer -master=weed-master:9333 -ip=seaweedfs -port=8888
    volumes:
      - weedfiler:/data
    depends_on:
      - weed-master
      - weed-volume

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - core
    environment:
      IC_DOMAIN: ${IC_DOMAIN}
    ports:
      # 宿主上已有反代时，改 IC_HTTP_PORT/IC_HTTPS_PORT 或删掉这两行自己接
      - "${IC_HTTP_PORT:-80}:80"
      - "${IC_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconf:/config

volumes:
  weeddata:
  weedmaster:
  weedfiler:
  pgdata:
  redisdata:
  caddydata:
  caddyconf:
