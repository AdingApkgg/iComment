# iComment 自托管部署：核心 + PG + Redis，Caddy 在前面收 HTTPS。
# 用法：
#   cp deploy/.env.example deploy/.env   # 填域名与密码
#   docker compose -f deploy/compose.yml --env-file deploy/.env up -d --build

name: icomment

services:
  core:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      IC_PROFILE: prod
      IC_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      IC_REDIS_URL: redis://redis:6379
      IC_PUBLIC_BASE_URL: https://${IC_DOMAIN}${IC_PUBLIC_PORT_SUFFIX:-}
      IC_WIDGET_CDN: https://${IC_DOMAIN}/widget/v1
      # 两个都填才启用人机验证，留空则整体关闭
      IC_TURNSTILE_SECRET: ${IC_TURNSTILE_SECRET:-}
      IC_TURNSTILE_SITE_KEY: ${IC_TURNSTILE_SITE_KEY:-}
      IC_SESSION_SECRET: ${IC_SESSION_SECRET}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8080"
    healthcheck:
      # distroless 没有 curl，用镜像自带的 health 子命令更稳
      test: ["CMD", "/usr/local/bin/icomment-core", "health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      # PG18 起数据目录带主版本子目录，挂父目录才能跨版本 pg_upgrade
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", ""]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - core
    environment:
      IC_DOMAIN: ${IC_DOMAIN}
    ports:
      # 宿主上已有反代时，改 IC_HTTP_PORT/IC_HTTPS_PORT 或删掉这两行自己接
      - "${IC_HTTP_PORT:-80}:80"
      - "${IC_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconf:/config

volumes:
  pgdata:
  redisdata:
  caddydata:
  caddyconf:
