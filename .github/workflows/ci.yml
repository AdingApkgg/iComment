name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: icomment
          POSTGRES_PASSWORD: icomment
          POSTGRES_DB: icomment
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U icomment"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      IC_DATABASE_URL: postgres://icomment:icomment@127.0.0.1:5432/icomment
      IC_REDIS_URL: redis://127.0.0.1:6379
      IC_SESSION_SECRET: ci-secret
      # 冒烟测试自己建 schema，缺这两个变量就整体跳过
      IC_TEST_DATABASE_URL: postgres://icomment:icomment@127.0.0.1:5432/icomment
      IC_TEST_REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # 冒烟用例缺依赖会静默跳过，这里断言它们真的跑过
      - run: cargo test -p icomment-core --test smoke -- --nocapture 2>&1 | tee smoke.log
      # 注意 "10 passed" 里也含 "0 passed"，必须连 test result 一起匹配
      - run: "! grep -q 'test result: ok. 0 passed' smoke.log"

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bunx biome check .
      - run: bunx tsc -b packages/mcp
      - run: bunx tsc -p packages/widget/tsconfig.json --noEmit
      - run: cd packages/widget && bun run build
      - uses: actions/upload-artifact@v4
        with:
          name: widget
          path: packages/widget/dist/icomment.js
