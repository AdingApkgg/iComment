name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: icomment
          POSTGRES_PASSWORD: icomment
          POSTGRES_DB: icomment
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U icomment"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      IC_DATABASE_URL: postgres://icomment:icomment@127.0.0.1:5432/icomment
      IC_REDIS_URL: redis://127.0.0.1:6379
      IC_SESSION_SECRET: ci-secret
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bunx biome check .
      - run: bunx tsc -p packages/sdk/tsconfig.json --noEmit
      - run: bunx tsc -p packages/mcp/tsconfig.json --noEmit
      - run: bunx tsc -p packages/widget/tsconfig.json --noEmit
      - run: cd packages/widget && bun run build
      - uses: actions/upload-artifact@v4
        with:
          name: widget
          path: packages/widget/dist/icomment.js
